[package]
name = "proxdesk"
version = "0.1.0"
description = "ProxDesk - Linux Native Proxmox VE Desktop Client"
authors = ["ProxDesk Developers"]
edition = "2021"

[lib]
name = "proxdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.3.0", features = [] }
tauri-plugin-opener = "2.2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
keyring = { version = "3.6", features = ["sync-secret-service"] }
sha2 = "0.10"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = { version = "0.23", features = ["handshake"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
